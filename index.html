<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laburanding</title>
</head>
<body>
    <header>

    </header>
    <main>
        <div id="divLogin">
            <h2>Login</h2>
            
                <label for="txtLogUser">Usuario:</label>
                <input type="text" id="txtLogUser">
                <br>
                <label for="txtLogPass">Contraseña:</label>
                <input type="text" id="txtLogPass">
                <br>
                <input type="button" value="Login" id="btnLogin">
            
            <input type="button" id="btnIrRegistrar" value="Registrar">
        </div>

        <div id="divRegistrar">
            
             <h1>Registro</h1>
    <label for="txtNombreUsuario">Nombre Usuario:</label>
    <input type="text" id="txtNombreUser">
    <br>
    <br>
    <label for="txtContrasena">Contraseña:</label>
    <input type="text" id="txtPass">
    <br>
    <br>
    <label for="txtNombre">Nombre:</label>
    <input type="text" id="txtNombre">
    <br>
    <br>
    <label for="slcNivel">Nivel de Experiencia:</label>
    <select id="slcNivel">
        <option value="" disabled selected>Seleccione su Nivel:</option>
        <option value="junior">Junior</option>
        <option value="semi-senior">Semi-Senior</option>
        <option value="senior">Senior</option>
    </select>
    <br>
    <br>
    <label for="slcArea">Area:</label>
    <select  id="slcArea">
        <option value="" disabled selected>Seleccione un Area:</option>
        <option value="tecnologia">Tecnologia</option>
        <option value="diseno">Diseño</option>
        <option value="marketing">Marketing</option>
        <option value="administracion">Administracion</option>
        <option value="otros">Otros</option>
    </select>
    <br>
    <br>
    <input type="button" id="btnRegistrar" value="Registrar">
    <input type="button" id="btnIrLogin" value="Volver al login">
        </div>


        <div id="divPostulante">
            <div id="divMenuPostulante">
                <h2>Menú Postulante</h2>
            </div>
                <input type="button" id="btnListadoOfertasActivas" value="Listado Ofertas Activas">
                <input type="button" id="btnMisPostulaciones" value="Mis Postulaciones">
                <input type="button" id="btnCatalogoOfertasDestacadas" value="Catalogo Ofertas Destacadas">
          
            <input type="button" id="btnCerrarSesion" value="Cerrar Sesion">
        </div>

          <div id="divAdmin">
            <div id="divMenuAdmin">
                <h2>Menú Administrador</h2>
                
            </div>

            <div id="divCrearOfertasLaborales">
                <input type="button" id="btnCrearOfertasLaborales" value="Crear Ofertas Laborales">
                
            </div>

            <div >
                <input type="button" value="Editar o cerrar ofertas" id="btnEditarCerrarOfertas">
            </div>
            
            <div id="divProcesarPostulaciones">
                <input type="button" id="btnProcesarPostulaciones" value="Procesar Postulaciones">
            </div>

            <div id="divVerEstadisticas">
                <input type="button" id="btnVerEstadisticas" value="Ver Estadisticas">
            </div>
            <input type="button" id="btnCerrarSesion" value="Cerrar Sesion">
        </div>

        <div id="divCrearOferta">
            <label for="txtTituloTrabajo">Titulo del trabajo</label>
            <input type="text" id="txtTituloTrabajo"> <br>
            <label for="txtNombreEmpresa">Nombre de la empresa</label>
            <input type="text" id="txtNombreEmpresa"> <br>
            <label for="slcArea">Area</label>
            <select id="slcAreaOferta">
                <option value="" disabled selected >Seleccione un Area:</option>
                <option value="tecnologia">Tecnologia</option>
                <option value="diseno">Diseño</option>
                <option value="marketing">Marketing</option>
                <option value="administracion">Administracion</option>
                <option value="otros">Otros</option>           
             </select> <br>
             <label for="txtDescripcionOferta">Descripcion</label>
             <input type="text" id="txtDescripcionOferta"><br>
             <label for="slcNivelRequerido">Nivel Requerido</label>
             <select id="slcNivelRequerido">
                <option value="" disabled selected>Seleccione su Nivel:</option>
                <option value="junior">Junior</option>
                <option value="semi-senior">Semi-Senior</option>
                <option value="senior">Senior</option>
             </select> <br>
             <label for="txtLimite">Limite:</label>
             <input type="number" id="txtLimite"><br>
             <label for="txtVacantes">Cantidad vacantes</label>
             <input type="number" id="txtVacantes"><br>
             <label for="checkboxDestacada">Oferta Destacada:</label>
             <input type="checkbox" id="checkboxDestacada"> <br>

             <input type="button" value="Guardar" id="btnGuardarOferta">
        </div>          
        <br>
        <div id="divEditarCerrarOferta" style="border: 1px solid black;">
            <h2></h2>
            
        </div>

    </main>
    <footer>

    </footer>

    <script src="js/script.js"></script>
</body>
</html>
